services:
  qdrant:
    image: qdrant/qdrant:v1.19.0
    restart: unless-stopped
    ports:
      - "${QDRANT_BIND_ADDRESS:-127.0.0.1}:6333:6333"
    volumes:
      - /Users/todaisy/Desktop/python_projects/MAESTRO/qdrant_storage:/qdrant/storage

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rag: &rag_runtime
    image: maestro-rag
    build:
      context: .
      args:
        PIP_INDEX_URL: ${BUILD_PIP_INDEX_URL:-https://pypi.org/simple}
        TORCH_INDEX_URL: ${TORCH_INDEX_URL:-https://download.pytorch.org/whl/cpu}
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    command: ["faststream", "run", "chat.kafka.broker:app", "--workers", "1"]
    volumes:
      - python_cache:/root/.cache
      - type: bind
        source: ${EMBEDDING_MODEL_HOST_PATH:-/Users/todaisy/models/ru-en-RoSBERTa}
        target: /models/ru-en-RoSBERTa
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      qdrant:
        condition: service_started
      redis:
        condition: service_healthy
    environment:
      FASTAPI_PORT: 8989
      REDIS_HOST: redis
      REDIS_PORT: 6379
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      QDRANT_MODE: server
      AUTO_INDEX_ON_START: "false"
      EMBEDDING_MODEL_NAME: /models/ru-en-RoSBERTa
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gpt-oss:20b}
      MEMORY_OLLAMA_TIMEOUT: ${MEMORY_OLLAMA_TIMEOUT:-180}
      SUPPORT_SERVICE_URL: ${SUPPORT_SERVICE_URL:-http://localhost:8067}
      # KAFKA_URL on the host may be localhost:9092; that cannot be used here.
      #KAFKA_URL: ${RAG_KAFKA_URL:-kafka:29092}
      KAFKA_URL: kafka:29092
      LLM_REQUEST_TOPIC: ${LLM_REQUEST_TOPIC:-llm-requests}
      LLM_RESPONSE_TOPIC: ${LLM_RESPONSE_TOPIC:-llm-responses}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - shared

  memory-api:
    <<: *rag_runtime
    command: ["uvicorn", "rag.api.dialogs_memory:app", "--host", "0.0.0.0", "--port", "8989"]
    ports:
      - "8989:8989"

volumes:
  qdrant_data:
  redis_data:
  python_cache:

networks:
  shared:
    external: true
    name: rlt_hack_network
