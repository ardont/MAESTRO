services:
  qdrant:
    image: dockerhub.timeweb.cloud/qdrant/qdrant:latest
    container_name: rlt_qdrant
    ports:
      - "6333:6333"
    volumes:
      - ./qdrant_storage:/qdrant/storage

  redis:
    image: redis:alpine
    container_name: rlt_redis
    ports:
      - "6379:6379"

  web:
    build: .
    container_name: rlt_django
    command: bash -c "cd RLT_project && python3 manage.py migrate && python3 manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
      - /home/rama/.cache:/root/.cache
    ports:
      - "8001:8000"

    depends_on:
      - qdrant
      - redis

    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - OLLAMA_HOST=http://host.docker.internal:11434
      - KAFKA_URL=kafka:29092
      - LLM_REQUEST_TOPIC=llm-requests
      - LLM_RESPONSE_TOPIC=llm-responses

    extra_hosts:
      - "host.docker.internal:host-gateway"

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    networks:
      - default
